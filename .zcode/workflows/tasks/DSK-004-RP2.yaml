design:
  confirmation: "files内部await确认，复用既有save-close IPC；clean idle也确认。取消/保存失败保留窗口及可用service；重复确认共享Promise，旧frame/requestId回执拒绝；回执不再自行window.close。"
  service: "首个await前停止接单/推进generation/停止定时器；pendingOperations和独立cleanup registry全排空。真实独立timeout覆盖整个等待，不用业务now；重复dispose共享Promise，成功close一次，失败blocked。"
  cleanup: "跟踪从transfer map移除后的cleanup及reload/sweeper/abort已有工作，等待期间新增cleanup也计入，避免自等待队列死锁。"
  coordinator: "main中OPEN/CONFIRMING/DRAINING/READY/FINALIZING及BLOCKED；close/beforequit同步拦截；单一最终动作所有者；成功才放行。drain后锁交互，blocked原生提示+用户重试，不恢复已停service编辑。"
  updates: "confirmInstall确认后await统一prepare，只有取得update所有权且READY才true；install同步验证一次授权后quitAndInstall；模拟失败受阻，不访问真实更新。"
