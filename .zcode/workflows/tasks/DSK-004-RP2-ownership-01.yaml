  callback: "状态改写前验归属；旧notice/finally/updater error不能清新owner授权。取消/错误BLOCKED锁定，不自动重试、不OPEN。"
  update: "失败后只普通close不重装；prepareUpdateExit只为自己有效update授权true，不把普通close结果误报安装许可。"
