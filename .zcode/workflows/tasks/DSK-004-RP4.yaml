design:
  primitive: "objects内部共用收集/逐块消费原语，经内部store方法供service使用；无新模块。limit为非负安全有限整数且+1不溢出，对象声明≤64MiB；保留trusted/lstat拒链接，打开后handle.stat普通文件/尺寸；单次请求≤min(64KiB,limit+1-totalRead)，短读循环，0字节EOF，limit后1字节哨兵不传sink；精确长度/hash，流式处理背压及部分写入。"
  routes: "get/put复用、verify/copy委托、上传tmp、snapshot.read、备份导出、manifest、恢复校验/复制/复核全接入；保留RP1活性仲裁及RP3permit。业务总量与多轮实际I/O遥测分开。"
  errors: "沿用corrupt-object/upload-format/io-failure/backup-invalid/path-refused；不宽泛catch抹去链接错误，读取主错误与close错误并存时保留主错误并另记资源。"
  cleanup: "批准内部store读取清理owner绑定与service既有RP2账本适配；无第二套drain/定时器。close失败同步交唯一owner，稳定身份、单飞重试、挂起/失败blocked且DB开，真实关闭后出账。独立store调用方显式接管资源；上传写句柄close失败不吞错继续提交。"
  manifest: "现有序列化只做一次，UTF8≤4MiB才写，超限transfer-limit且不发布；非RP5逐token或峰值保证。真实10000不同digest/schema合法小对象顺序round-trip，保留既有5000/10000单digest。合法预算冲突停止重规划。"
