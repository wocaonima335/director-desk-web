    evidence_required: "每次请求/返回/累计字节与实际句柄标识。"
  - id: A3
    criterion: "预检到open、fstat到首读、部分读取后增长/截断；累计≤limit+1且精确长度/hash校验。"
    evidence_required: "可达屏障与次数、字节轨迹，不仅_lastReadBytes。"
  - id: A4
    criterion: "get/put复用与委托、真实snapshot.read触达读取门；损坏同名对象不覆盖。"
    evidence_required: "真实入口调用、hash与原字节保护。"
  - id: A5
    criterion: "上传tmp正常/短读/增长/截断/read或close失败；失败revision/current不变、资源不遗失。"
    evidence_required: "DB指针对照与句柄/临时路径清理记录。"
  - id: A6
    criterion: "多块流式导出；增长/截断/hash/写失败不发布且清自身目标，无无界readFile或全对象收集。"
    evidence_required: "真实块/sink轨迹、失败发布与清理断言。"
  - id: A7
    criterion: "导入新/已有目标均有界，坏目标不变，临时文件不遗留不误删旧对象。"
    evidence_required: "源/目标字节及tmp清理、预算轨迹。"
  - id: A8
    criterion: "恢复manifest/首次校验/再复制/复制后复核分别可达，变化被拒且无错误登记。"
    evidence_required: "分阶段门命中、源项目/备份保持及登记计数。"
  - id: A9
    criterion: "合法JSON空白补齐4MiB-1/4MiB可恢复、+1拒；短读/增长/写超限；10000独立对象往返。"
    evidence_required: "distinct digest、manifest UTF8/对象总字节/耗时、5000及10000旧场景保留。"
  - id: A10
    criterion: "stat/read/sink异常仍关闭；瞬时/持续close失败、挂起重试、叠加错误；无双owner，blocked DB开、清理后关库恰1。"
    evidence_required: "close调用/并发计数、实际资源最终释放及DB关闭计数。"
  - id: A11
    criterion: "junction外部哨兵不变；abort/reload/close不迟到发布/登记，RP3permit和RP2drain保持。"
    evidence_required: "既有回归及新读取屏障竞争真实断言。"
