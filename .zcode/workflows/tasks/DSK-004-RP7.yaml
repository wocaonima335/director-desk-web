acceptance:
  - id: RP7-A1
    criterion: "切换在确认前捕获 identity、binding、epoch、revision/context；确认后及关键 await 后复核。确认期间状态变化不得继续执行旧意图。"
    evidence_required: "可控制时序的竞态测试"
  - id: RP7-A2
    criterion: "同一用户动作只确认一次；拒绝确认不创建候选、不改变持久选择或旧 binding。"
    evidence_required: "确认次数与 wire 调用断言"
  - id: RP7-A3
    criterion: "open/create/activate/save 的迟到回执只作用于自己的操作和目标，不覆盖其他候选或 active binding。"
    evidence_required: "延迟回执具名测试"
  - id: RP7-A4
    criterion: "下载、解析、准备或激活前验证失败时，旧文档、历史、dirty、binding、租约和持久选择不变，只清理本次候选。"
    evidence_required: "失败路径状态对照"
  - id: RP7-A5
    criterion: "activate 成功后应用失败时文档经 RP6 回滚并补偿持久选择；补偿失败进入明确 unconfirmed，不伪称已恢复。"
    evidence_required: "prepare/swap/补偿失败测试"
  - id: RP7-A6
    criterion: "同项目重开不关闭复用会话、不新建租约；应用失败保持旧版本；应用成功同时采用下载 SnapshotRef 与 revision。"
    evidence_required: "成功/失败对照及 close/open 次数"
  - id: RP7-A7
    criterion: "revision1 已提交为 revision2 但回执不确定，重开采用 revision2，再次保存得到 revision3；取消重开保留旧 dirty 与版本。"
    evidence_required: "controller 连接真实 service/library 的隔离测试，禁止只用 mock 返回 revision3"
  - id: RP7-A8
    criterion: "直接调用 controller.saveSnapshot 在 unconfirmed 时拒绝，无 upload，版本不变；只有完整成功的重开/切换才能解除这种未确认状态。"
    evidence_required: "绕过 UI 的直接调用测试"
  - id: RP7-A9
    criterion: "RP6 write-blocked 时，受管切换、创建和保存不能靠身份变化绕过；补偿成功不能解除编辑器硬禁写。"
    evidence_required: "WriteGate 组合测试与源码路径"
  - id: RP7-A10
    criterion: "受管启动恢复走统一候选与 RP6；失败不读 legacy recovery，不把已有受管启动选择改成 unmanaged，不泄漏本次候选。"
    evidence_required: "启动协调测试与 main 接线核对"
  - id: RP7-A11
    criterion: "只清理本次拥有的候选与传输；旧会话仅在完整成功后释放；清理失败不把已提交切换报成未提交，不关闭复用会话，不删除已保存项目。"
    evidence_required: "清理失败与重复结束测试"
  - id: RP7-A12
    criterion: "RP1–RP6 预算与保护不变，既有断言不弱化。"
    evidence_required: "定向回归与 tsc"
  - id: RP7-R01
    criterion: "服务端 activate 已 setLastSession 后，候选被关闭或替换时不得走未提交失败。必须补偿回原持久选择，或进入明确 unconfirmed；迟到回执不得覆盖更新的候选、binding 或禁写。无原 binding 且目标已关闭时不得猜 sessionId，也不得伪称已恢复为 unmanaged。"
    evidence_required: "真实 service/library 上、提交已落盘后的延迟回执测试，并用独立 bootstrap 探针核对持久选择"
  - id: RP7-R02
    criterion: "WriteGate blocked 时，保存分流前统一拒绝：不上传、不调用 files('save-project')、不清 dirty。离开受管身份不能绕过。普通保存成功语义和显式导出副本保持不变。"
    evidence_required: "真实 saveProjectFile 与项目库 leave 入口组合测试"
